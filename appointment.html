<head>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header>
        <div class="brand">
            <img src="logo2.jpg" alt="logo" class="logo1">
            <span class="brand-title"> Ashar Specialist Medical Center</span>
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="navMenu">
            <a href="index.html">Home</a>
            <a href="appointment.html">Appointment</a>
            <a href="doctor.html">Doctors</a>
            <a href="services.html">Services</a>
            <a href="about.html">About Us</a>
            <a href="map.html">Map</a>
        </nav>
    </header>
    </header>

    <section class="page-title">
        <h1>Book an Appointment</h1>
        <p>Select a doctor, date and available time.</p>
    </section>

    <section class="appointment-container">

        <form id="appointmentForm">

            <label>Patient Name</label>
            <input type="text" id="patientName" required>

            <label>Phone Number</label>
            <input type="tel" id="phone" required>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Select Our Department</label>

            <select id="department" required>
                <option value="">Choose Departments</option>
                <option>General Practice</option>
                <option>ENT</option>
                <option>Oncology</option>
                <option>Radiology</option>
                <option>Laboratory</option>
                <option>Audiology</option>
            </select>

            <label>Select Doctor</label>

            <select id="doctor" required>
                <option value="">Choose Doctor</option>
                <option>Dr. Sarah Banda</option>
                <option>Dr. James Phiri</option>
                <option>Dr. Suzgo Mzumara</option>
                <option>Dr. Moses Chirwa</option>
            </select>

            <label>Appointment Date</label>
            <input type="date" id="date" required>

            <label>Available Time</label>

            <select id="time" required>
                <option value="">Choose Time</option>
                <option>08:00 AM</option>
                <option>09:00 AM</option>
                <option>10:00 AM</option>
                <option>11:00 AM</option>
                <option>02:00 PM</option>
                <option>03:00 PM</option>
                <option>04:00 PM</option>
            </select>

            <button type="submit" class="btn">
                <i class="fa-solid fa-calendar-check"></i>
                Confirm Appointment
            </button>

        </form>

    </section>

    <footer>
        <p>&copy; 2026 Ashar Specialist Medical Center</p>

        <div class="social-media">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-linkedin-in"></i></a>
        </div>
    </footer>
    <script src="javason.js"></script>
</body>

</html>
